    <script>
      (function () {
        "use strict";

        const englishMode = document.getElementById("englishMode");

        const galacticMode = document.getElementById("galacticMode");

        const inputLabel = document.getElementById("inputLabel");

        const outputLabel = document.getElementById("outputLabel");

        const inputText = document.getElementById("inputText");

        const resultText = document.getElementById("resultText");

        const copyButton = document.getElementById("copyButton");

        const clearButton = document.getElementById("clearButton");

        const alphabetGrid = document.getElementById("alphabetGrid");

        const footerCopy = document.getElementById("footer-copy");

        const languageToggle = document.getElementById("language-toggle");

        const alphabet = [
          ["A", "ᔑ"],
          ["B", "ʖ"],
          ["C", "ᓵ"],
          ["D", "↸"],
          ["E", "ᒷ"],
          ["F", "⎓"],
          ["G", "⊣"],
          ["H", "⍑"],
          ["I", "╎"],
          ["J", "⋮"],
          ["K", "ꖌ"],
          ["L", "ꖎ"],
          ["M", "ᒲ"],
          ["N", "リ"],
          ["O", "𝙹"],
          ["P", "!¡"],
          ["Q", "ᑑ"],
          ["R", "∷"],
          ["S", "ᓭ"],
          ["T", "ℸ"],
          ["U", "⚍"],
          ["V", "⍊"],
          ["W", "∴"],
          ["X", "̇/"],
          ["Y", "||"],
          ["Z", "⨅"],
        ];

        const encodeMap = new Map();
        const decodeMap = new Map();

        alphabet.forEach(([letter, symbol]) => {
          encodeMap.set(letter, symbol);
          decodeMap.set(symbol, letter);
        });

        const decodeSymbols = [...decodeMap.keys()].sort(
          (a, b) => b.length - a.length,
        );

        let mode = "encode";
        function getLanguageFromUrl() {
          const url = new URL(location.href);
          const selectedLanguage = url.searchParams.get("lang");

          if (selectedLanguage === "ja") {
            url.searchParams.delete("lang");
            history.replaceState(history.state, "", url);
          }

          return selectedLanguage === "en" ? "en" : "ja";
        }

        let language = getLanguageFromUrl();
        let copyResetTimeout;
        let copySucceeded = false;

        function updateLanguage() {
          document.documentElement.lang = language;

          document.querySelectorAll("[data-ja][data-en]").forEach((element) => {
            element.textContent = element.dataset[language];
          });

          document
            .querySelectorAll("[data-aria-ja][data-aria-en]")
            .forEach((element) => {
              element.setAttribute(
                "aria-label",
                element.dataset[`aria${language === "ja" ? "Ja" : "En"}`],
              );
            });

          languageToggle.textContent = language === "ja" ? "English" : "日本語";
          languageToggle.setAttribute(
            "aria-label",
            language === "ja" ? "英語に切り替え" : "Switch to Japanese",
          );

          const isEnglish = language === "en";
          const pageTitle = isEnglish
            ? "Standard Galactic Alphabet Translator | MC Tools"
            : "標準銀河アルファベット変換 | MC Tools";
          const pageDescription = isEnglish
            ? "Translate text between the Standard Galactic Alphabet used in Minecraft enchantment tables and the Latin alphabet."
            : "Minecraftのエンチャントテーブルで使われる標準銀河アルファベット（Standard Galactic Alphabet / SGA）と英字を相互変換できるツールです。";

          document.title = pageTitle;
          document.querySelector('meta[name="description"]').content =
            pageDescription;
          document.querySelector('meta[property="og:title"]').content =
            pageTitle;
          document.querySelector('meta[property="og:description"]').content =
            pageDescription;
          document.querySelector('meta[name="twitter:title"]').content =
            pageTitle;
          document.querySelector('meta[name="twitter:description"]').content =
            pageDescription;
          document.querySelector('meta[property="og:locale"]').content =
            isEnglish ? "en_US" : "ja_JP";

          updateModeLabels();
          copyButton.textContent = copySucceeded
            ? isEnglish
              ? "Copied!"
              : "コピーしました！"
            : copyButton.dataset[language];
        }

        function updateModeLabels() {
          const isEnglish = language === "en";
          const isEncode = mode === "encode";

          inputLabel.textContent = isEncode
            ? isEnglish
              ? "Latin text"
              : "英字"
            : isEnglish
              ? "Standard Galactic Alphabet"
              : "標準銀河アルファベット";

          outputLabel.textContent = isEncode
            ? isEnglish
              ? "Standard Galactic Alphabet (result)"
              : "標準銀河アルファベット（変換結果）"
            : isEnglish
              ? "Latin text (result)"
              : "英字（変換結果）";

          inputText.placeholder = isEncode
            ? "Hello Minecraft!"
            : "⍑ᒷꖎꖎ𝙹 ᒲ╎リᒷᓵ∷ᔑ⎓ℸ!";
          resultText.placeholder = isEncode
            ? "⍑ᒷꖎꖎ𝙹 ᒲ╎リᒷᓵ∷ᔑ⎓ℸ!"
            : "HELLO MINECRAFT!";
        }

        function encode(text) {
          return [...text]
            .map((char) => {
              const upper = char.toUpperCase();

              return encodeMap.get(upper) || char;
            })
            .join("");
        }

        function decode(text) {
          let result = "";
          let index = 0;

          while (index < text.length) {
            let matched = false;

            for (const symbol of decodeSymbols) {
              if (text.startsWith(symbol, index)) {
                result += decodeMap.get(symbol);
                index += symbol.length;
                matched = true;
                break;
              }
            }

            if (!matched) {
              result += text[index];
              index++;
            }
          }

          return result;
        }

        function updateFromResult() {
          if (mode === "encode") {
            resultText.value = encode(inputText.value);
          } else {
            resultText.value = decode(inputText.value);
          }
        }

        function updateFromInput() {
          if (mode === "encode") {
            inputText.value = decode(resultText.value);
          } else {
            inputText.value = encode(resultText.value);
          }
        }

        function setMode(nextMode) {
          if (mode === nextMode) return;

          const oldInput = inputText.value;
          const oldResult = resultText.value;
          inputText.value = oldResult;
          resultText.value = oldInput;

          mode = nextMode;

          const isEncode = mode === "encode";

          englishMode.classList.toggle("active", isEncode);

          galacticMode.classList.toggle("active", !isEncode);

          updateModeLabels();

          inputText.focus();
        }

        function createAlphabetTable() {
          alphabet.forEach(([letter, symbol]) => {
            const item = document.createElement("div");

            item.className = "alphabet-item";

            const letterEl = document.createElement("span");

            letterEl.className = "alphabet-letter";

            letterEl.textContent = letter;

            const symbolEl = document.createElement("span");

            symbolEl.className = "alphabet-symbol";

            symbolEl.textContent = symbol;

            item.appendChild(letterEl);
            item.appendChild(symbolEl);

            alphabetGrid.appendChild(item);
          });
        }

        async function copyResult() {
          const text = resultText.value;

          if (!text) {
            return;
          }

          try {
            await navigator.clipboard.writeText(text);

            copySucceeded = true;
            copyButton.textContent =
              language === "ja" ? "コピーしました！" : "Copied!";

            clearTimeout(copyResetTimeout);
            copyResetTimeout = setTimeout(() => {
              copySucceeded = false;
              copyButton.textContent = copyButton.dataset[language];
            }, 1200);
          } catch {
            resultText.select();

            document.execCommand("copy");
          }
        }

        function initializeFooter() {
          if (!footerCopy) {
            return;
          }

          const baseYear = 2026;

          const currentYear = new Date().getFullYear();

          const hostname = location.hostname;

          let copyrightYear;

          if (currentYear < baseYear) {
            copyrightYear = `${currentYear}~${baseYear}`;
          } else if (currentYear > baseYear) {
            copyrightYear = `${baseYear}~${currentYear}`;
          } else {
            copyrightYear = baseYear;
          }

          let footerHTML = `&copy; ${copyrightYear} `;

          if (hostname.includes("hamuzon.github.io")) {
            footerHTML += `<a
                    href="https://hamuzon.github.io"
                    target="_blank"
                    rel="noopener"
                >@hamuzon</a>`;
          } else if (hostname.includes("hamusata.f5.si")) {
            footerHTML += `<a
                    href="https://hamusata.f5.si"
                    target="_blank"
                    rel="noopener"
                >@hamusata</a>`;
          } else if (hostname.includes("hamuzon-jp.f5.si")) {
            footerHTML += `<a
                    href="https://hamuzon-jp.f5.si"
                    target="_blank"
                    rel="noopener"
                >@hamuzon</a>`;
          } else {
            footerHTML += "MC Tools";
          }

          footerCopy.innerHTML = footerHTML;
        }

        englishMode.addEventListener("click", () => {
          setMode("encode");
        });

        galacticMode.addEventListener("click", () => {
          setMode("decode");
        });

        inputText.addEventListener("input", updateFromResult);

        resultText.addEventListener("input", updateFromInput);

        copyButton.addEventListener("click", copyResult);

        clearButton.addEventListener("click", () => {
          inputText.value = "";
          resultText.value = "";
          inputText.focus();
        });

        languageToggle.addEventListener("click", () => {
          language = language === "ja" ? "en" : "ja";
          const url = new URL(location.href);
          if (language === "en") {
            url.searchParams.set("lang", "en");
          } else {
            url.searchParams.delete("lang");
          }
          history.pushState({ language }, "", url);
          updateLanguage();
        });

        window.addEventListener("popstate", () => {
          language = getLanguageFromUrl();
          updateLanguage();
        });

        createAlphabetTable();
        initializeFooter();
        updateLanguage();
      })();
    </script>
  </body>
</html>
