<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Counter - mono.hamusata.f5.si</title>

  <meta name="description" content="Simple counter.">
  <meta name="author" content="hamusata">

  <link href="https://fonts.googleapis.com/css2?family=Potta+One&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Potta One', cursive;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #3f3a35;
      overflow-x: hidden;
    }

    .aurora-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 80% 60% at 70% 20%, rgba(175,109,255,0.65), transparent 68%),
        radial-gradient(ellipse 70% 60% at 20% 80%, rgba(255,160,190,0.7), transparent 68%),
        radial-gradient(ellipse 60% 50% at 60% 65%, rgba(255,235,170,0.95), transparent 68%),
        linear-gradient(180deg, #f7eaff 0%, #fde2ea 100%);
      animation: auroraMove 20s linear infinite alternate;
    }

    @keyframes auroraMove {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.05);
      }
    }

    .wrapper {
      width: 100%;
      max-width: 520px;
      padding: 40px 20px;
      text-align: center;
    }

    .counter {
      padding: 42px 30px;
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #3f526b;
      font-size: 2.6rem;
      margin-bottom: 32px;
      text-shadow: 1px 1px 5px rgba(255, 255, 255, 0.8);
    }

    #count {
      width: 100%;
      padding: 20px 10px;
      margin-bottom: 28px;
      border-radius: 18px;
      background: rgba(255, 253, 248, 0.72);
      border: 1px solid rgba(63, 82, 107, 0.12);
      color: #2f3e52;
      font-family: sans-serif;
      font-size: 64px;
      font-weight: 600;
      line-height: 1;
      box-shadow:
        inset 0 2px 8px rgba(63, 58, 53, 0.06),
        0 6px 18px rgba(0, 0, 0, 0.08);
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      min-width: 82px;
      height: 52px;
      padding: 10px 18px;
      border: 1px solid rgba(63, 82, 107, 0.16);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      color: #2f3e52;
      font-family: sans-serif;
      font-size: 20px;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.1);
    }

    button:hover {
      background: rgba(243, 218, 218, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    }

    #reset {
      min-width: 130px;
      color: #ffffff;
      background: rgba(183, 101, 101, 0.88);
      border-color: rgba(183, 101, 101, 0.5);
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    #reset:hover {
      background: rgba(164, 87, 87, 0.95);
    }

    footer {
      margin-top: 24px;
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #5f5960;
      opacity: 0.9;
    }

    footer a {
      color: #3f526b;
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .wrapper {
        padding: 20px;
      }

      .counter {
        padding: 34px 22px;
      }

      h1 {
        font-size: 2.2rem;
      }

      #count {
        font-size: 52px;
      }
    }
  </style>
</head>

<body>

  <div class="aurora-background"></div>

  <div class="wrapper">

    <main class="counter">
      <h1>Counter</h1>

      <div id="count">0</div>

      <div class="buttons">
        <button id="minus">−</button>
        <button id="plus">＋</button>
      </div>

      <button id="reset">Reset</button>
    </main>

    <footer>
      &copy; <span id="year"></span>
      <a href="https://hamusata.f5.si" target="_blank" rel="noopener">hamusata</a>
    </footer>

  </div>

  <script>
    const BASE_YEAR = 2026;

    let count = 0;

    const countElement = document.getElementById("count");
    const plusButton = document.getElementById("plus");
    const minusButton = document.getElementById("minus");
    const resetButton = document.getElementById("reset");

    plusButton.addEventListener("click", () => {
      count++;
      countElement.textContent = count;
    });

    minusButton.addEventListener("click", () => {
      count--;
      countElement.textContent = count;
    });

    resetButton.addEventListener("click", () => {
      count = 0;
      countElement.textContent = count;
    });

    const year = new Date().getFullYear();

    document.getElementById("year").textContent =
      year > BASE_YEAR ? `${BASE_YEAR} ~ ${year}` : BASE_YEAR;
  </script>

</body>
</html>
