      }

      .header-row .cell {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .dimension {
        display: block;
        font-weight: 600;
      }

      .dimension-name {
        display: block;
      }

      .overworld-row {
        background: #fbfcf9;
      }

      .overworld-row .dimension-name {

      }

      .nether-row {

      .axis {

  <body>
    <main class="container">
      <header>

        </div>

        <h1 data-ja="ネザー座標変換" data-en="Nether Coordinate Converter">

        </h1>

        <p
          class="lead"
          data-ja="オーバーワールドとネザーのX・Z座標を変換します。"
          data-en="Convert X and Z coordinates between the Overworld and the Nether."

          オーバーワールドとネザーのX・Z座標を変換します。
        </p>

      <section
        class="calculator"
        aria-label="ネザー座標変換計算機"
        data-aria-ja="ネザー座標変換計算機"
        data-aria-en="Nether coordinate converter"
      >
        <div
          class="calculator-title"

          data-en="Dimension XZ"
        >

        </div>

        <div class="table">
          <div class="row header-row">
            <div class="cell" data-ja="ディメンション" data-en="Dimension">
              ディメンション
            </div>
            <div class="cell">X</div>
            <div class="cell">Z</div>
          </div>

          <div class="row overworld-row">
            <div class="cell dimension">
              <span
                class="dimension-name"
                data-ja="オーバーワールド"
                data-en="Overworld"
              >
                オーバーワールド
              </span>
            </div>

            <div class="cell">
              <span class="axis">X</span>

              <input
                id="overworldX"
                class="overworld-input"
                type="number"
                inputmode="numeric"
                placeholder="0"
                aria-label="オーバーワールド X座標"
                data-aria-ja="オーバーワールド X座標"
                data-aria-en="Overworld X coordinate"
              />
            </div>

            <div class="cell">
              <span class="axis">Z</span>

              <input
                id="overworldZ"
                class="overworld-input"
                type="number"
                inputmode="numeric"
                placeholder="0"
                aria-label="オーバーワールド Z座標"
                data-aria-ja="オーバーワールド Z座標"
                data-aria-en="Overworld Z coordinate"
              />
            </div>
          </div>

          <div class="row nether-row">
            <div class="cell dimension">
              <span class="dimension-name" data-ja="ネザー" data-en="Nether">
                ネザー
              </span>
            </div>

            <div class="cell">
              <span class="axis">X</span>

              <input
                id="netherX"
                class="nether-input"
                type="number"
                inputmode="numeric"
                placeholder="0"
                aria-label="ネザー X座標"
                data-aria-ja="ネザー X座標"
                data-aria-en="Nether X coordinate"
              />
            </div>

            <div class="cell">
              <span class="axis">Z</span>

              <input
                id="netherZ"
                class="nether-input"
                type="number"
                inputmode="numeric"
                placeholder="0"
                aria-label="ネザー Z座標"
                data-aria-ja="ネザー Z座標"
                data-aria-en="Nether Z coordinate"
              />
            </div>
          </div>

      </section>

      <section class="notice">
        <h2
          data-ja="ネザー座標の計算方法"
          data-en="How Nether Coordinates Work"
        >
          ネザー座標の計算方法
        </h2>

        <p
          data-ja="オーバーワールドとネザーでは、X・Z座標が8:1の比率になります。"
          data-en="The Overworld and Nether use an 8:1 ratio for X and Z coordinates."
        >
          オーバーワールドとネザーでは、X・Z座標が8:1の比率になります。
        </p>

        <div class="formula">
          <span
            data-ja="オーバーワールド → ネザー　X・Z ÷ 8"
            data-en="Overworld → Nether: X, Z ÷ 8"
            >オーバーワールド → ネザー　X・Z ÷ 8</span
          ><br />
          <span
            data-ja="ネザー → オーバーワールド　X・Z × 8"
            data-en="Nether → Overworld: X, Z × 8"
            >ネザー → オーバーワールド　X・Z × 8</span
          >
        </div>
      </section>

      <footer>
        <p
          data-ja="Minecraft は Mojang AB の登録商標です。当サイトは非公式のツールであり、Mojang AB とは関係ありません。"
          data-en="Minecraft is a registered trademark of Mojang AB. This is an unofficial tool and is not affiliated with Mojang AB."
        >
          Minecraft は Mojang AB の登録商標です。
          当サイトは非公式のツールであり、Mojang AB とは関係ありません。
        </p>

        <span id="footer-copy"></span>
      </footer>
    </main>

    <script>
      (function () {
        "use strict";

        const overworldX = document.getElementById("overworldX");
        const overworldZ = document.getElementById("overworldZ");
        const netherX = document.getElementById("netherX");
        const netherZ = document.getElementById("netherZ");
        const footerCopy = document.getElementById("footer-copy");
        const languageToggle = document.getElementById("language-toggle");

        const RATIO = 8;
        let isUpdating = false;
        function getLanguageFromUrl() {
          const url = new URL(location.href);
          const selectedLanguage = url.searchParams.get("lang");

          if (selectedLanguage === "ja") {
            url.searchParams.delete("lang");
            history.replaceState(history.state, "", url);
          }

          return selectedLanguage === "en" ? "en" : "ja";
        }

        let language = getLanguageFromUrl();

        function updateLanguage() {
          document.documentElement.lang = language;

          document.querySelectorAll("[data-ja][data-en]").forEach((element) => {
            element.textContent = element.dataset[language];
          });

          document
            .querySelectorAll("[data-aria-ja][data-aria-en]")
            .forEach((element) => {
              element.setAttribute(
                "aria-label",
                element.dataset[`aria${language === "ja" ? "Ja" : "En"}`],
              );
            });

          languageToggle.textContent = language === "ja" ? "English" : "日本語";
          languageToggle.setAttribute(
            "aria-label",
            language === "ja" ? "英語に切り替え" : "Switch to Japanese",
          );

          const isEnglish = language === "en";
          const pageTitle = isEnglish
            ? "Nether Coordinate Converter | MC Tools"
            : "ネザー座標変換 | MC Tools";
          const pageDescription = isEnglish
            ? "Convert X and Z coordinates between the Minecraft Overworld and Nether with this coordinate calculator."
            : "Minecraft (マイクラ) のオーバーワールドとネザーのX・Z座標を変換できるネザー・オーバーワールド座標計算機。";

          document.title = pageTitle;
          document.querySelector('meta[name="description"]').content =
            pageDescription;
          document.querySelector('meta[property="og:title"]').content =
            pageTitle;
          document.querySelector('meta[property="og:description"]').content =
            pageDescription;
          document.querySelector('meta[name="twitter:title"]').content =
            pageTitle;
          document.querySelector('meta[name="twitter:description"]').content =
            pageDescription;
          document.querySelector('meta[property="og:locale"]').content =
            isEnglish ? "en_US" : "ja_JP";
        }

        function toInteger(value) {
          return Number.isFinite(value) ? Math.trunc(value) : "";
        }

        function updateCoordinates(
          sourceX,
          sourceZ,
          destX,
          destZ,
          toOverworld = false,
        ) {
          if (isUpdating) return;

          isUpdating = true;

          try {
            const x = Number(sourceX.value);
            const z = Number(sourceZ.value);

            const operation = (coordinate) => {
              return toOverworld ? coordinate * RATIO : coordinate / RATIO;
            };

            destX.value = sourceX.value === "" ? "" : toInteger(operation(x));

            destZ.value = sourceZ.value === "" ? "" : toInteger(operation(z));
          } finally {
            isUpdating = false;
          }
        }

        function initializeFooter() {
          if (!footerCopy) return;

          const baseYear = 2026;
          const currentYear = new Date().getFullYear();
          const hostname = location.hostname;

          let copyrightYear;

          if (currentYear < baseYear) {
            copyrightYear = `${currentYear}~${baseYear}`;
          } else if (currentYear > baseYear) {
            copyrightYear = `${baseYear}~${currentYear}`;
          } else {
            copyrightYear = baseYear;
          }

          let footerHTML = `&copy; ${copyrightYear} `;

          if (hostname.includes("hamuzon.github.io")) {
            footerHTML += `<a href="https://hamuzon.github.io" target="_blank" rel="noopener">@hamuzon</a>`;
          } else if (hostname.includes("hamusata.f5.si")) {
            footerHTML += `<a href="https://hamusata.f5.si" target="_blank" rel="noopener">@hamusata</a>`;
          } else if (hostname.includes("hamuzon-jp.f5.si")) {
            footerHTML += `<a href="https://hamuzon-jp.f5.si" target="_blank" rel="noopener">@hamuzon</a>`;
          } else {
            footerHTML += "MC Tools";
          }

          footerCopy.innerHTML = footerHTML;
        }

        function initializeEventListeners() {
          languageToggle.addEventListener("click", () => {
            language = language === "ja" ? "en" : "ja";
            const url = new URL(location.href);
            if (language === "en") {
              url.searchParams.set("lang", "en");
            } else {
              url.searchParams.delete("lang");
            }
            history.pushState({ language }, "", url);
            updateLanguage();
          });

          window.addEventListener("popstate", () => {
            language = getLanguageFromUrl();
            updateLanguage();
          });

          overworldX.addEventListener("input", () => {
            updateCoordinates(overworldX, overworldZ, netherX, netherZ);
          });

          overworldZ.addEventListener("input", () => {
            updateCoordinates(overworldX, overworldZ, netherX, netherZ);
          });

          netherX.addEventListener("input", () => {
            updateCoordinates(netherX, netherZ, overworldX, overworldZ, true);
          });

          netherZ.addEventListener("input", () => {
            updateCoordinates(netherX, netherZ, overworldX, overworldZ, true);
          });
        }

        initializeEventListeners();
        initializeFooter();
        updateLanguage();
      })();
    </script>
  </body>
