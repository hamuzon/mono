    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #f7f5f0;
            --surface: #fffefa;
            --surface-soft: #faf9f5;
            --border: #dddcd2;
            --text: #403f39;
            --muted: #77776e;

            --english: #718f68;

        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: var(--background);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",

            line-height: 1.6;

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: min(100% - 24px, 1200px);
            margin: 0 auto;
            padding: 20px 0 16px;
        }


        header {
            margin-bottom: 14px;
            flex-shrink: 0;

            letter-spacing: -0.02em;

        .lead {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }



        .main-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 16px;
            flex: 1;
            min-height: 0;

        .converter {
            display: flex;
            flex-direction: column;

        .converter-title {
            padding: 10px 17px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-soft);
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .mode {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
        }

        .mode button {
            flex: 1;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--surface-soft);
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            transition:
                background 0.15s,
                color 0.15s,
                border-color 0.15s;
        }

        .mode button:hover {
            border-color: var(--english);
        }

        .mode button.active {
            border-color: var(--english);
            background: var(--english-soft);
            color: var(--english);
        }

        .input-section {
            display: flex;
            flex-direction: column;
            padding: 14px;
            flex: 1;
            min-height: 0;
        }

        .input-label {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        textarea {
            display: block;
            width: 100%;
            flex: 1;
            min-height: 60px;
            padding: 9px 12px;
            resize: none;
            border: 1px solid var(--border);
            border-radius: 5px;
            outline: none;
            background: #fff;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            line-height: 1.7;
            transition:
                border-color 0.15s,
                box-shadow 0.15s;
        }

        textarea:focus {
            border-color: var(--english);

        textarea.galactic {

        }

        .result {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .result-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-shrink: 0;
        }

        .result-actions button {
            height: 34px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--surface-soft);
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
        }

        .result-actions button:hover {
            border-color: var(--english);
        }



        .right-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .notice {
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            flex-shrink: 0;
        }

        .notice h2 {
            margin: 0 0 5px;
            font-size: 14px;
        }

        .notice p {
            margin: 3px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .formula {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 5px;
            background: var(--galactic-soft);
            color: var(--text);
            font-size: 12px;
        }



        .alphabet {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .alphabet-title {
            padding: 10px 17px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-soft);
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .alphabet-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            overflow-y: auto;
            flex: 1;
            min-height: 0;
        }

        .alphabet-item {
            display: grid;
            grid-template-columns: 36px 1fr;
            align-items: center;
            min-height: 38px;
            padding: 4px 8px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .alphabet-item:nth-child(2n) {
            border-right: 0;
        }

        .alphabet-item:nth-last-child(-n + 2) {
            border-bottom: 0;
        }

        .alphabet-letter {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .alphabet-symbol {
            color: var(--galactic);
            font-size: 18px;
            line-height: 1;
        }



        footer {
            margin-top: 10px;
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            flex-shrink: 0;
        }

        footer p {
            margin: 0 0 4px;
            font-size: 10px;
            line-height: 1.4;
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }



        @media (max-width: 800px) {

            body {
                height: auto;
                overflow: auto;
            }

            .container {
                height: auto;
                width: min(100% - 16px, 760px);
                padding: 24px 0 32px;
            }

            .main-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 22px;
            }

            .mode {
                flex-direction: column;
            }

            .mode button {
                flex: none;
            }

            textarea {
                min-height: 100px;
                flex: none;
            }

            .result {
                flex: none;
            }

            .alphabet-grid {
                overflow-y: visible;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header>
            <p class="brand">MC Tools</p>

            <h1>標準銀河アルファベット変換</h1>

            <p class="lead">
                英字と標準銀河アルファベットを相互に変換します。
            </p>
        </header>

        <div class="main-grid">

            <section class="converter" aria-label="標準銀河アルファベット変換ツール">

                <div class="converter-title">
                    Standard Galactic Alphabet
                </div>

                <div class="mode">

                    <button id="englishMode" class="active" type="button">
                        英字 → 標準銀河
                    </button>

                    <button id="galacticMode" type="button">
                        標準銀河 → 英字
                    </button>

                </div>

                <div class="input-section">

                    <label id="inputLabel" class="input-label" for="inputText">
                        英字
                    </label>

                    <textarea id="inputText" placeholder="Hello Minecraft!" spellcheck="false" autocomplete="off"
                        aria-label="変換元のテキスト"></textarea>

                    <div class="result">

                        <label id="outputLabel" class="input-label" for="resultText">
                            標準銀河アルファベット（変換結果）
                        </label>

                        <textarea id="resultText" class="galactic" placeholder="ᔑ" spellcheck="false" autocomplete="off"
                            aria-label="変換結果のテキスト"></textarea>

                        <div class="result-actions">

                            <button id="copyButton" type="button">
                                結果をコピー
                            </button>

                            <button id="clearButton" type="button">
                                クリア
                            </button>

                        </div>

                    </div>

                </div>

            </section>

            <div class="right-column">

                <section class="notice">

                    <h2>標準銀河アルファベットとは？</h2>

                    <p>
                        Minecraftのエンチャントテーブルなどで使われている
                        文字体系です。英字A〜Zを別の記号に置き換えます。
                    </p>

                    <div class="formula">
                        英字 → 標準銀河：A〜Zを対応する記号へ変換<br>
                        標準銀河 → 英字：対応する記号をA〜Zへ変換
                    </div>

                </section>

                <section class="alphabet">

                    <div class="alphabet-title">
                        標準銀河アルファベット対応表
                    </div>

                    <div id="alphabetGrid" class="alphabet-grid"></div>

                </section>

            </div>

        </div>

        <footer>

            <p>
                Minecraft は Mojang AB の登録商標です。
                当サイトは非公式のツールであり、Mojang ABとは関係ありません。
            </p>

            <span id="footer-copy"></span>

        </footer>

    </main>

    <script>
        (function () {
            "use strict";


            const englishMode =
                document.getElementById("englishMode");

            const galacticMode =
                document.getElementById("galacticMode");

            const inputLabel =
                document.getElementById("inputLabel");

            const outputLabel =
                document.getElementById("outputLabel");

            const inputText =
                document.getElementById("inputText");

            const resultText =
                document.getElementById("resultText");

            const copyButton =
                document.getElementById("copyButton");

            const clearButton =
                document.getElementById("clearButton");

            const alphabetGrid =
                document.getElementById("alphabetGrid");

            const footerCopy =
                document.getElementById("footer-copy");


            const alphabet = [
                ["A", "ᔑ"],
                ["B", "ʖ"],
                ["C", "ᓵ"],
                ["D", "↸"],
                ["E", "ᒷ"],
                ["F", "⎓"],
                ["G", "⊣"],
                ["H", "⍑"],
                ["I", "╎"],
                ["J", "⋮"],
                ["K", "ꖌ"],
                ["L", "ꖎ"],
                ["M", "ᒲ"],
                ["N", "リ"],
                ["O", "𝙹"],
                ["P", "!¡"],
                ["Q", "ᑑ"],
                ["R", "∷"],
                ["S", "ᓭ"],
                ["T", "ℸ"],
                ["U", "⚍"],
                ["V", "⍊"],
                ["W", "∴"],
                ["X", "̇/"],
                ["Y", "||"],
                ["Z", "⨅"]
            ];


            const encodeMap = new Map();
            const decodeMap = new Map();

            alphabet.forEach(([letter, symbol]) => {
                encodeMap.set(letter, symbol);
                decodeMap.set(symbol, letter);
            });

            const decodeSymbols =
                [...decodeMap.keys()]
                    .sort((a, b) => b.length - a.length);

            let mode = "encode";


            function encode(text) {

                return [...text]
                    .map(char => {

                        const upper =
                            char.toUpperCase();

                        return encodeMap.get(upper) || char;

                    })
                    .join("");

            }


            function decode(text) {

                let result = "";
                let index = 0;

                while (index < text.length) {

                    let matched = false;

                    for (const symbol of decodeSymbols) {

                        if (
                            text.startsWith(
                                symbol,
                                index
                            )
                        ) {
                            result += decodeMap.get(symbol);
                            index += symbol.length;
                            matched = true;
                            break;
                        }

                    }

                    if (!matched) {
                        result += text[index];
                        index++;
                    }

                }

                return result;

            }


            function updateFromResult() {

                if (mode === "encode") {
                    resultText.value =
                        encode(inputText.value);
                } else {
                    resultText.value =
                        decode(inputText.value);
                }

            }


            function updateFromInput() {

                if (mode === "encode") {
                    inputText.value =
                        decode(resultText.value);
                } else {
                    inputText.value =
                        encode(resultText.value);
                }

            }


            function setMode(nextMode) {

                if (mode === nextMode) return;

                const oldInput = inputText.value;
                const oldResult = resultText.value;
                inputText.value = oldResult;
                resultText.value = oldInput;

                mode = nextMode;

                const isEncode =
                    mode === "encode";

                englishMode.classList.toggle(
                    "active",
                    isEncode
                );

                galacticMode.classList.toggle(
                    "active",
                    !isEncode
                );


                if (isEncode) {

                    inputLabel.textContent =
                        "英字";

                    outputLabel.textContent =
                        "標準銀河アルファベット（変換結果）";

                    inputText.placeholder =
                        "Hello Minecraft!";

                    resultText.placeholder =
                        "⍑ᒷꖎꖎ𝙹 ᒲ╎リᒷᓵ∷ᔑ⎓ℸ!";

                } else {

                    inputLabel.textContent =
                        "標準銀河アルファベット";

                    outputLabel.textContent =
                        "英字（変換結果）";

                    inputText.placeholder =
                        "⍑ᒷꖎꖎ𝙹 ᒲ╎リᒷᓵ∷ᔑ⎓ℸ!";

                    resultText.placeholder =
                        "HELLO MINECRAFT!";

                }

                inputText.focus();

            }


            function createAlphabetTable() {

                alphabet.forEach(([letter, symbol]) => {

                    const item =
                        document.createElement("div");

                    item.className =
                        "alphabet-item";


                    const letterEl =
                        document.createElement("span");

                    letterEl.className =
                        "alphabet-letter";

                    letterEl.textContent =
                        letter;


                    const symbolEl =
                        document.createElement("span");

                    symbolEl.className =
                        "alphabet-symbol";

                    symbolEl.textContent =
                        symbol;


                    item.appendChild(letterEl);
                    item.appendChild(symbolEl);

                    alphabetGrid.appendChild(item);

                });

            }


            async function copyResult() {

                const text =
                    resultText.value;

                if (!text) {
                    return;
                }

                try {

                    await navigator.clipboard.writeText(
                        text
                    );

                    const originalText =
                        copyButton.textContent;

                    copyButton.textContent =
                        "コピーしました！";

                    setTimeout(() => {

                        copyButton.textContent =
                            originalText;

                    }, 1200);

                } catch {

                    resultText.select();

                    document.execCommand("copy");

                }

            }


            function initializeFooter() {

                if (!footerCopy) {
                    return;
                }

                const baseYear = 2026;

                const currentYear =
                    new Date().getFullYear();

                const hostname =
                    location.hostname;


                let copyrightYear;

                if (currentYear < baseYear) {

                    copyrightYear =
                        `${currentYear}~${baseYear}`;

                } else if (currentYear > baseYear) {

                    copyrightYear =
                        `${baseYear}~${currentYear}`;

                } else {

                    copyrightYear =
                        baseYear;

                }


                let footerHTML =
                    `&copy; ${copyrightYear} `;


                if (
                    hostname.includes(
                        "hamuzon.github.io"
                    )
                ) {

                    footerHTML +=
                        `<a
                    href="https://hamuzon.github.io"
                    target="_blank"
                    rel="noopener"
                >@hamuzon</a>`;

                } else if (
                    hostname.includes(
                        "hamusata.f5.si"
                    )
                ) {

                    footerHTML +=
                        `<a
                    href="https://hamusata.f5.si"
                    target="_blank"
                    rel="noopener"
                >@hamusata</a>`;

                } else if (
                    hostname.includes(
                        "hamuzon-jp.f5.si"
                    )
                ) {

                    footerHTML +=
                        `<a
                    href="https://hamuzon-jp.f5.si"
                    target="_blank"
                    rel="noopener"
                >@hamuzon</a>`;

                } else {

                    footerHTML +=
                        "MC Tools";

                }

                footerCopy.innerHTML =
                    footerHTML;

            }


            englishMode.addEventListener(
                "click",
                () => {
                    setMode("encode");
                }
            );

            galacticMode.addEventListener(
                "click",
                () => {
                    setMode("decode");
                }
            );

            inputText.addEventListener(
                "input",
                updateFromResult
            );

            resultText.addEventListener(
                "input",
                updateFromInput
            );

            copyButton.addEventListener(
                "click",
                copyResult
            );

            clearButton.addEventListener(
                "click",
                () => {

                    inputText.value = "";
                    resultText.value = "";
                    inputText.focus();

                }
            );


            createAlphabetTable();
            initializeFooter();

        })();
    </script>

</body>

</html>
